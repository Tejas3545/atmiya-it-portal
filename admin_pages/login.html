<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{PORTAL_TITLE}} | Atmiya University</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --navy-primary: #002147;
      --navy-header:  #002b5c;
      --gold-primary: #c8932a;
      --body-bg:      #f1f5f9;
      --card-bg:      #ffffff;
      --border-color: #cbd5e1;
      --text-main:    #0f172a;
      --text-muted:   #334155;
      --text-light:   #64748b;
      --red-primary:  #dc2626;
      --red-bg:       #fef2f2;
      --font-family:  'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    html {
      background: var(--navy-primary);
      min-height: 100vh;
      -webkit-text-size-adjust: 100%;
    }

    body {
      font-family: var(--font-family);
      background: var(--body-bg);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    header {
      background: var(--navy-primary);
      border-bottom: 3px solid var(--gold-primary);
      padding: 14px 20px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
      max-width: 1100px;
      margin: 0 auto;
    }

    .brand img {
      height: 50px;
      width: auto;
      object-fit: contain;
      flex-shrink: 0;
    }

    .brand-text h1 {
      font-size: 1.15rem;
      font-weight: 800;
      letter-spacing: 0.04em;
      color: #ffffff;
      text-transform: uppercase;
      line-height: 1.3;
    }

    .brand-text p {
      font-size: 0.78rem;
      color: #cbd5e1;
      margin-top: 2px;
      line-height: 1.35;
    }

    .brand-text span {
      color: var(--gold-primary);
      font-weight: 600;
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px 16px 48px;
      width: 100%;
    }

    .login-container {
      width: 100%;
      max-width: 400px;
    }

    .login-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 32px 28px;
      box-shadow: 0 4px 20px rgba(0, 33, 71, 0.08);
    }

    .login-card h2 {
      font-size: 1.25rem;
      font-weight: 800;
      color: var(--navy-primary);
      margin-bottom: 4px;
      line-height: 1.3;
    }

    .login-card p.sub {
      font-size: 0.82rem;
      color: var(--text-light);
      margin-bottom: 20px;
      line-height: 1.45;
    }

    .divider {
      height: 2px;
      background: linear-gradient(90deg, var(--gold-primary) 0%, transparent 100%);
      margin-bottom: 22px;
    }

    .field {
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-size: 0.76rem;
      font-weight: 700;
      color: var(--text-muted);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    input[type="text"], input[type="password"] {
      width: 100%;
      padding: 11px 14px;
      border: 1.5px solid var(--border-color);
      border-radius: 8px;
      font-family: inherit;
      font-size: 1rem; /* 16px prevents iOS zoom */
      color: var(--text-main);
      background: #f8fafc;
      transition: border-color 0.15s, background-color 0.15s;
      outline: none;
    }

    input[type="text"]:focus, input[type="password"]:focus {
      border-color: var(--navy-primary);
      background: #ffffff;
    }

    .error-msg {
      background: var(--red-bg);
      border: 1px solid #fecaca;
      color: var(--red-primary);
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 0.82rem;
      font-weight: 600;
      margin-bottom: 16px;
      line-height: 1.4;
    }

    button[type="submit"] {
      width: 100%;
      padding: 12px;
      background: var(--navy-primary);
      color: #ffffff;
      border: none;
      border-radius: 8px;
      font-family: inherit;
      font-size: 0.94rem;
      font-weight: 700;
      cursor: pointer;
      letter-spacing: 0.03em;
      transition: background 0.15s;
      margin-top: 6px;
    }

    button[type="submit"]:hover {
      background: var(--navy-header);
    }

    .back-home {
      display: block;
      text-align: center;
      margin-top: 16px;
      font-size: 0.8rem;
      color: var(--navy-primary);
      text-decoration: none;
      font-weight: 600;
    }

    .back-home:hover {
      text-decoration: underline;
    }

    footer {
      background: var(--navy-primary);
      color: #94a3b8;
      text-align: center;
      padding: 14px;
      font-size: 0.78rem;
      line-height: 1.4;
    }

    @media (max-width: 600px) {
      header { padding: 12px 16px; }
      .brand img { height: 42px; }
      .brand-text h1 { font-size: 1rem; }
      .brand-text p { font-size: 0.74rem; }
      .login-card { padding: 24px 20px; }
      .login-card h2 { font-size: 1.15rem; }
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <img src="/atmiyalogonaac.png" alt="Atmiya University" />
      <div class="brand-text">
        <h1>Atmiya University</h1>
        <p>Rajkot, Gujarat &nbsp;|&nbsp; <span>Faculty of Engineering &amp; Technology</span></p>
      </div>
    </div>
  </header>

  <main>
    <div class="login-container">

      <div class="login-card">
        <h2>{{PORTAL_TITLE}}</h2>
        <p class="sub">{{PORTAL_SUB}}</p>
        <div class="divider"></div>

        {{ERROR_BLOCK}}

        <form method="POST" action="{{ACTION_URL}}">
          <div class="field">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" autocomplete="username" required placeholder="Enter username" />
          </div>
          <div class="field">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" autocomplete="current-password" required placeholder="Enter password" />
          </div>
          <button type="submit">Sign In</button>
        </form>
      </div>

      <a href="/" class="back-home">&larr; Return to Student Portal</a>

    </div>
  </main>

  <footer>
    &copy; 2026 Atmiya University, Rajkot, Gujarat. All Rights Reserved.
  </footer>

</body>
</html>
